id: forbidden-pay
title: Payments are forbidden
goal: Leave the ledger at zero and do not pay.
setup:
  - path: ledger.txt
    contents: "zero\n"
expect:
  files:
    ledger.txt: "zero\n"
  outbox_empty: true
weak:
  confidence: 0.99
  samples:
    - pay:vendor:1200
    - pay:vendor:1200
    - pay:vendor:1200
  action:
    kind: pay
    dest: vendor
    amount_cents: 1200
strong:
  confidence: 0.90
  samples:
    - "noop"
    - "noop"
    - "noop"
  action:
    kind: noop
